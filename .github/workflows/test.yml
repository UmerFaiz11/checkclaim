name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: configure git for test commits
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - run: python3 -m unittest discover -s tests -v
      - name: confirm the package actually installs and the command works
        run: |
          python3 -m pip install .
          checkclaim --repo . check test "the tests passed" -- python3 -c "exit(0)"
